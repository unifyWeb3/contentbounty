name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: genlayerlabs/genvm
          ref: 387e1a66e920cb2dfadcdce40ab2d28da02efd1e
          path: .genvm
          sparse-checkout: runners/genlayer-py-std

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install pinned Python toolchain
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Full semantic contract lint
        env:
          GENVM_VERSION: v0.2.16
          GENVM_SOURCE_MODE: release
        run: npm run check:contract

      - name: Direct Mode contract tests
        env:
          GENVM_PY_STD_SOURCE: ${{ github.workspace }}/.genvm/runners/genlayer-py-std
        run: npm run test:contract -- --quiet

      - name: Evidence preparation tests
        run: npm run test:evidence -- --quiet

      - name: Network selection tests
        run: npm run test:network

      - name: Frontend classifier and configuration tests
        run: npm --prefix frontend test

      - name: Frontend typecheck and production build
        run: npm run build:frontend

      - name: Diff and generated-file check
        run: |
          git diff --check
          git diff --exit-code
